name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The badge step on `main` commits an updated README back to the repo.
permissions:
  contents: write

# Avoid overlapping badge commit-backs from concurrent pushes to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On `push` events to `main` we explicitly check out the branch
          # (not a detached SHA) so the badge step can `git push` back.  On
          # `pull_request` events we fall through to actions/checkout's
          # default (the PR's merge ref resolved from `github.ref` =
          # `refs/pull/<n>/merge`); an empty string disables the explicit
          # `ref:` and triggers that default.  We deliberately avoid
          # `github.head_ref` (attacker-controllable on forked PRs) and
          # `github.ref_name` (which resolves to `<pr>/merge` on
          # `pull_request` events and is not a fetchable branch ref —
          # closes issue #49).  The badge step is gated to main pushes, so
          # PR runs never need write access.
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      # Pin the toolchain: the trybuild compile-fail tests compare rustc's
      # diagnostics verbatim, and those change between releases. Raise this
      # together with the local toolchain and the blessed `.stderr` files.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        # `shell: bash` runs with `-o pipefail` (the default shell does not),
        # so a test failure still fails this step despite the pipe into `tee`.
        # `cargo test` also builds the whole workspace, so this doubles as the
        # build gate.
        shell: bash
        run: cargo test --workspace 2>&1 | tee test-output.txt

      - name: Rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

      - name: Update test badge (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Sum the "N passed" counts across every `test result:` line
          # (unit + integration + doc tests). Input is our own test log, not
          # any untrusted GitHub context.
          count=$(grep -oE '[0-9]+ passed' test-output.txt | awk '{s+=$1} END{print s+0}')
          echo "passing tests: ${count}"
          if [ "${count}" -eq 0 ]; then
            echo "::warning::parsed 0 passing tests — leaving badge unchanged"
            exit 0
          fi
          # Update both the alt-text and the shields.io URL in each README.
          sed -i -E \
            -e "s#tests: [0-9]+ passing#tests: ${count} passing#g" \
            -e "s#tests-[0-9]+%20passing#tests-${count}%20passing#g" \
            README.md README.ja.md
          if git diff --quiet -- README.md README.ja.md; then
            echo "badge already up to date (${count})"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md
          git commit -m "ci: update test badge to ${count} passing [skip ci]"
          git push

  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Test game export
        run: cargo test -p socsim-games --features export
