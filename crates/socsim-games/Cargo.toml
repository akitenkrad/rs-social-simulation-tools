[package]
name        = "socsim-games"
description = "Normal-form games and game-theoretic simulation components for socsim"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
core = ["dep:socsim-core", "dep:serde_json"]
engine = ["core", "dep:socsim-engine"]
metrics = ["core", "dep:socsim-metrics"]
net = ["core", "dep:socsim-net"]
grid = ["core", "dep:socsim-grid"]
llm = ["core", "dep:socsim-llm", "dep:sha2"]
live = ["llm", "socsim-llm/live"]
factory = ["engine", "dep:socsim-runner", "dep:socsim-config"]
config = ["factory", "dep:toml"]

[dependencies]
microlp = "0.6"
serde.workspace = true
rand.workspace = true
thiserror.workspace = true
socsim-core = { path = "../socsim-core", optional = true }
socsim-engine = { path = "../socsim-engine", optional = true }
socsim-llm = { path = "../socsim-llm", optional = true }
socsim-metrics = { path = "../socsim-metrics", optional = true, default-features = false }
socsim-net = { path = "../socsim-net", optional = true }
socsim-grid = { path = "../socsim-grid", optional = true }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
sha2 = { workspace = true, optional = true }
socsim-runner = { path = "../socsim-runner", optional = true }
socsim-config = { path = "../socsim-config", optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
trybuild = "1"

