<svg width="100%" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>async_population_step mechanism data flow</title>
<desc>PreStep and Reward mechanism from socsim-games, the asynchronous population update for held agents, built by assemble_async. In PreStep it clears the play arena, payoffs and play counts. In Reward it activates agents one at a time (AgentOrder: the scheduler's order; UniformWithReplacement: N uniform draws with replacement). For each activated agent it recomputes the local payoffs the rule reads from the current held actions into scratch space, applies the imitate_best, fermi_update or replicator_update rule and writes the agent's new action to held at once. After the last activation it plays the whole step from the final held actions and writes payoffs, play counts and the step history once.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6F4EE"/>
    <stop offset="1" stop-color="#ECEAE2"/>
  </linearGradient>
  <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-weight: 700; }
    .body  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
</defs>

<rect x="3" y="3" width="754" height="334" rx="18" fill="url(#bg)" stroke="#D9D6CC" stroke-width="1.5"/>

<!-- phase strip: PreStep and Reward active -->
<g class="body" font-size="11.5">
  <rect x="40"  y="28" width="108" height="26" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <text x="94"  y="45" fill="#534AB7" text-anchor="middle" font-weight="700">PreStep</text>
  <rect x="156" y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="210" y="45" fill="#6B6A64" text-anchor="middle">Environment</text>
  <rect x="272" y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="326" y="45" fill="#6B6A64" text-anchor="middle">Decision</text>
  <rect x="388" y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="442" y="45" fill="#6B6A64" text-anchor="middle">Interaction</text>
  <rect x="504" y="28" width="108" height="26" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <text x="558" y="45" fill="#534AB7" text-anchor="middle" font-weight="700">Reward</text>
  <rect x="620" y="28" width="100" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="670" y="45" fill="#6B6A64" text-anchor="middle">PostStep</text>
</g>

<!-- input state -->
<g>
  <rect x="40" y="104" width="170" height="134" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text class="body" x="125" y="96" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="600">reads</text>
  <text class="mono" x="56" y="132" font-size="12.5" fill="#0B5040">held (current)</text>
  <text class="mono" x="56" y="154" font-size="12.5" fill="#0B5040">game payoffs</text>
  <text class="mono" x="56" y="176" font-size="12.5" fill="#0B5040">topology N(i)</text>
  <text class="body" x="56" y="196" font-size="11" fill="#3C7E6C">implicit pattern:</text>
  <text class="body" x="56" y="212" font-size="11" fill="#3C7E6C">grid, network or</text>
  <text class="body" x="56" y="228" font-size="11" fill="#3C7E6C">whole population</text>
</g>

<!-- mechanism box -->
<g>
  <rect x="250" y="80" width="260" height="182" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
  <text class="title" x="380" y="107" font-size="17" fill="#332E6E" text-anchor="middle">async_population_step</text>
  <text class="body"  x="380" y="126" font-size="12" fill="#6B6A64" text-anchor="middle">asynchronous imitation</text>
  <line x1="270" y1="137" x2="490" y2="137" stroke="#C7C2E8" stroke-width="1"/>
  <text class="mono" x="266" y="156" font-size="11.5" fill="#332E6E">for each activation i:</text>
  <text class="mono" x="286" y="175" font-size="11.5" fill="#332E6E">π ← local payoffs</text>
  <text class="mono" x="314" y="194" font-size="11.5" fill="#332E6E">of i and N(i)</text>
  <text class="mono" x="286" y="213" font-size="11.5" fill="#332E6E">held[i] ← rule(i, π)</text>
  <text class="mono" x="266" y="238" font-size="11.5" fill="#332E6E">then play the step once</text>
  <text class="mono" x="266" y="254" font-size="11.5" fill="#332E6E">from the final held</text>
</g>

<!-- output state -->
<g>
  <rect x="550" y="104" width="170" height="134" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text class="body" x="635" y="96" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="600">writes</text>
  <text class="mono" x="566" y="132" font-size="12.5" fill="#0B5040">held</text>
  <text class="body" x="566" y="149" font-size="11" fill="#3C7E6C">one agent at a time</text>
  <text class="mono" x="566" y="176" font-size="12.5" fill="#0B5040">payoff, n_played</text>
  <text class="mono" x="566" y="196" font-size="12.5" fill="#0B5040">step history</text>
  <text class="body" x="566" y="214" font-size="11" fill="#3C7E6C">once, at the end</text>
  <text class="body" x="566" y="229" font-size="11" fill="#3C7E6C">(plays stay empty)</text>
</g>

<!-- arrows -->
<path d="M210 171 H247" stroke="#534AB7" stroke-width="1.6" marker-end="url(#hr)"/>
<path d="M510 171 H547" stroke="#534AB7" stroke-width="1.6" marker-end="url(#hr)"/>

<!-- footnote -->
<text class="body" x="380" y="296" font-size="12" fill="#6B6A64" text-anchor="middle">Built by assemble_async in place of game_match, game_decide, game_play and the dynamic · held agents only</text>
<text class="body" x="380" y="314" font-size="11.5" fill="#9A988F" text-anchor="middle">AgentOrder: scheduler order · UniformWithReplacement: N uniform draws, as in Huberman &amp; Glance (1993)</text>

</svg>
