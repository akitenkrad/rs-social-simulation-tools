<svg width="100%" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>fermi_update mechanism data flow</title>
<desc>Reward mechanism from socsim-games, a population dynamic for held agents. It reads every agent's step payoff, the held actions and, when present, the topology. Each agent draws one comparison partner (a neighbour, or any other agent without topology) and adopts the partner's held action with probability 1 / (1 + exp(-(pi_j - pi_i) / K)). All next actions are computed from the pre-update state into a buffer and written to held at once. Draws a partner and one uniform number per agent from ctx.rng.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6F4EE"/>
    <stop offset="1" stop-color="#ECEAE2"/>
  </linearGradient>
  <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-weight: 700; }
    .body  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
</defs>

<rect x="3" y="3" width="754" height="324" rx="18" fill="url(#bg)" stroke="#D9D6CC" stroke-width="1.5"/>

<!-- phase strip: Reward active -->
<g class="body" font-size="11.5">
  <rect x="40"  y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="94"  y="45" fill="#6B6A64" text-anchor="middle">PreStep</text>
  <rect x="156" y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="210" y="45" fill="#6B6A64" text-anchor="middle">Environment</text>
  <rect x="272" y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="326" y="45" fill="#6B6A64" text-anchor="middle">Decision</text>
  <rect x="388" y="28" width="108" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="442" y="45" fill="#6B6A64" text-anchor="middle">Interaction</text>
  <rect x="504" y="28" width="108" height="26" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <text x="558" y="45" fill="#534AB7" text-anchor="middle" font-weight="700">Reward</text>
  <rect x="620" y="28" width="100" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="670" y="45" fill="#6B6A64" text-anchor="middle">PostStep</text>
</g>

<!-- input state -->
<g>
  <rect x="40" y="104" width="170" height="124" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text class="body" x="125" y="96" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="600">reads</text>
  <text class="mono" x="56" y="132" font-size="12.5" fill="#0B5040">payoff (π)</text>
  <text class="mono" x="56" y="154" font-size="12.5" fill="#0B5040">held</text>
  <text class="mono" x="56" y="176" font-size="12.5" fill="#0B5040">topology</text>
  <text class="body" x="56" y="194" font-size="11" fill="#3C7E6C">optional: partner is a</text>
  <text class="body" x="56" y="209" font-size="11" fill="#3C7E6C">neighbour or any other</text>
</g>

<!-- mechanism box -->
<g>
  <rect x="262" y="86" width="236" height="160" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
  <text class="title" x="380" y="114" font-size="18" fill="#332E6E" text-anchor="middle">fermi_update</text>
  <text class="body"  x="380" y="134" font-size="12" fill="#6B6A64" text-anchor="middle">pairwise comparison (Fermi)</text>
  <line x1="282" y1="146" x2="478" y2="146" stroke="#C7C2E8" stroke-width="1"/>
  <text class="mono" x="280" y="166" font-size="11.5" fill="#332E6E">j = partner(i)</text>
  <text class="mono" x="280" y="185" font-size="11.5" fill="#332E6E">W = 1/(1+e^{-(π_j−π_i)/K})</text>
  <text class="mono" x="280" y="204" font-size="11.5" fill="#332E6E">u &lt; W ⇒ next[i] = held[j]</text>
  <text class="mono" x="280" y="223" font-size="11.5" fill="#332E6E">else next[i] = held[i]</text>
</g>

<!-- output state -->
<g>
  <rect x="550" y="104" width="170" height="124" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text class="body" x="635" y="96" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="600">writes</text>
  <text class="mono" x="566" y="132" font-size="12.5" fill="#0B5040">held</text>
  <text class="body" x="566" y="150" font-size="11" fill="#3C7E6C">all agents at once</text>
  <text class="body" x="566" y="165" font-size="11" fill="#3C7E6C">(buffer swap,</text>
  <text class="body" x="566" y="180" font-size="11" fill="#3C7E6C">Update::Synchronous)</text>
</g>

<!-- arrows -->
<path d="M210 166 H259" stroke="#534AB7" stroke-width="1.6" marker-end="url(#hr)"/>
<path d="M498 166 H547" stroke="#534AB7" stroke-width="1.6" marker-end="url(#hr)"/>

<!-- ctx.rng tag -->
<g>
  <rect x="270" y="258" width="220" height="22" rx="9" fill="#FBFAF6" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="body" x="380" y="273" font-size="12" fill="#534AB7" text-anchor="middle">ctx.rng: partner + u per agent</text>
</g>

<!-- footnote -->
<text class="body" x="380" y="302" font-size="12" fill="#6B6A64" text-anchor="middle">Runs after game_decide · held agents only · K finite and &gt; 0</text>
<text class="body" x="380" y="318" font-size="11.5" fill="#9A988F" text-anchor="middle">W is evaluated by the sign of the payoff gap, so it never overflows.</text>

</svg>
