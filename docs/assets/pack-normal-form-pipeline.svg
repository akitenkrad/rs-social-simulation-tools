<svg width="100%" viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>normal-form pack — mechanism pipeline</title>
<desc>One step of a normal-form scenario. In PreStep game_match clears the step; in Decision game_match seats agents into encounters and game_decide lets each rule choose an action; in Interaction game_play writes the payoffs, optionally through the counting path for anonymous games and with the game's aggregates; in Reward game_decide lets the rules learn and at most one population dynamic (imitate_best, fermi_update, replicator_update or moran_update) updates the held agents; in PostStep game_metrics records the game metrics. Environment is not used. All state lives in GameWorld.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6F4EE"/>
    <stop offset="1" stop-color="#ECEAE2"/>
  </linearGradient>
  <marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-weight: 700; }
    .body  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
</defs>

<rect x="3" y="3" width="914" height="424" rx="18" fill="url(#bg)" stroke="#D9D6CC" stroke-width="1.5"/>

<text class="title" x="460" y="34" font-size="16" fill="#0F6E56" text-anchor="middle">normal-form — mechanism pipeline (one step)</text>

<!-- phase strip -->
<g class="body" font-size="11.5">
  <rect x="40"  y="54" width="132" height="26" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="106" y="71" fill="#0F6E56" text-anchor="middle" font-weight="700">PreStep</text>
  <rect x="180" y="54" width="132" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="246" y="71" fill="#6B6A64" text-anchor="middle">Environment</text>
  <rect x="320" y="54" width="132" height="26" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="386" y="71" fill="#0F6E56" text-anchor="middle" font-weight="700">Decision</text>
  <rect x="460" y="54" width="132" height="26" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="526" y="71" fill="#0F6E56" text-anchor="middle" font-weight="700">Interaction</text>
  <rect x="600" y="54" width="132" height="26" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="666" y="71" fill="#0F6E56" text-anchor="middle" font-weight="700">Reward</text>
  <rect x="740" y="54" width="132" height="26" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="806" y="71" fill="#0F6E56" text-anchor="middle" font-weight="700">PostStep</text>
</g>

<!-- PreStep: game_match clears the step -->
<rect x="46" y="100" width="120" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text class="mono" x="106" y="121" font-size="12" fill="#0B5040" text-anchor="middle">game_match</text>
<text class="body" x="106" y="138" font-size="10" fill="#3C7E6C" text-anchor="middle">clear encounters,</text>
<text class="body" x="106" y="151" font-size="10" fill="#3C7E6C" text-anchor="middle">payoffs, n_played</text>

<!-- Environment: not used -->
<text class="body" x="246" y="196" font-size="10.5" fill="#9A988F" text-anchor="middle">not used</text>

<!-- Decision: game_match seats, game_decide chooses -->
<rect x="326" y="100" width="120" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text class="mono" x="386" y="121" font-size="12" fill="#0B5040" text-anchor="middle">game_match</text>
<text class="body" x="386" y="138" font-size="10" fill="#3C7E6C" text-anchor="middle">seat agents into</text>
<text class="body" x="386" y="151" font-size="10" fill="#3C7E6C" text-anchor="middle">encounters</text>

<rect x="326" y="172" width="120" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text class="mono" x="386" y="193" font-size="12" fill="#0B5040" text-anchor="middle">game_decide</text>
<text class="body" x="386" y="210" font-size="10" fill="#3C7E6C" text-anchor="middle">each rule picks</text>
<text class="body" x="386" y="223" font-size="10" fill="#3C7E6C" text-anchor="middle">an action</text>

<!-- Interaction: game_play -->
<rect x="466" y="100" width="120" height="130" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text class="mono" x="526" y="121" font-size="12" fill="#0B5040" text-anchor="middle">game_play</text>
<text class="body" x="526" y="138" font-size="10" fill="#3C7E6C" text-anchor="middle">payoffs from the</text>
<text class="body" x="526" y="151" font-size="10" fill="#3C7E6C" text-anchor="middle">stage game</text>
<rect x="476" y="164" width="100" height="24" rx="8" fill="#FBFAF6" stroke="#0F6E56" stroke-width="0.9"/>
<text class="mono" x="526" y="180" font-size="10" fill="#0B5040" text-anchor="middle">counting</text>
<rect x="476" y="196" width="100" height="24" rx="8" fill="#FBFAF6" stroke="#0F6E56" stroke-width="0.9"/>
<text class="mono" x="526" y="212" font-size="10" fill="#0B5040" text-anchor="middle">aggregates</text>
<text class="body" x="526" y="246" font-size="9.5" fill="#6B6A64" text-anchor="middle">optional params</text>

<!-- Reward: learning, then at most one dynamic -->
<rect x="606" y="100" width="120" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text class="mono" x="666" y="121" font-size="12" fill="#0B5040" text-anchor="middle">game_decide</text>
<text class="body" x="666" y="138" font-size="10" fill="#3C7E6C" text-anchor="middle">rules learn from</text>
<text class="body" x="666" y="151" font-size="10" fill="#3C7E6C" text-anchor="middle">the payoffs</text>

<rect x="606" y="172" width="120" height="118" rx="10" fill="#FBFAF6" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="5 3"/>
<text class="body" x="666" y="192" font-size="11" fill="#0F6E56" text-anchor="middle" font-weight="700">dynamic (≤ 1)</text>
<g class="mono" font-size="10" fill="#0B5040" text-anchor="middle">
  <text x="666" y="212">imitate_best</text>
  <text x="666" y="228">fermi_update</text>
  <text x="666" y="244">replicator_update</text>
  <text x="666" y="260">moran_update</text>
</g>
<text class="body" x="666" y="280" font-size="9.5" fill="#6B6A64" text-anchor="middle">held agents only</text>

<!-- PostStep: game_metrics -->
<rect x="746" y="100" width="120" height="200" rx="10" fill="#534AB7" stroke="#332E6E" stroke-width="1.3"/>
<text class="mono" x="806" y="121" font-size="12" fill="#FBFAF6" text-anchor="middle">game_metrics</text>
<g class="mono" font-size="10" fill="#E1E0F8" text-anchor="middle">
  <text x="806" y="140">played_share.a&lt;k&gt;</text>
  <text x="806" y="154">mean_payoff</text>
  <text x="806" y="168">payoff_sd</text>
  <text x="806" y="182">coop_rate</text>
  <text x="806" y="196">regret</text>
  <text x="806" y="210">eq_distance</text>
  <text x="806" y="224">action_entropy</text>
  <text x="806" y="238">population_share</text>
  <text x="806" y="252">aggregate.*</text>
  <text x="806" y="266">mean_action.&lt;d&gt;</text>
</g>
<text class="body" x="806" y="287" font-size="9.5" fill="#D8D4F4" text-anchor="middle">stop_tol → early stop</text>

<!-- flow arrows -->
<g stroke="#0F6E56" stroke-width="1.6" fill="none">
  <path d="M166 129 H324" marker-end="url(#gn)"/>
  <path d="M386 158 V170" marker-end="url(#gn)"/>
  <path d="M446 201 H464" marker-end="url(#gn)"/>
  <path d="M586 129 H604" marker-end="url(#gn)"/>
  <path d="M666 158 V170" marker-end="url(#gn)"/>
  <path d="M726 231 H744" marker-end="url(#gn)"/>
</g>

<!-- shared state -->
<rect x="40" y="318" width="832" height="52" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text class="mono" x="58" y="340" font-size="12.5" fill="#332E6E" font-weight="700">GameWorld&lt;G, X&gt;</text>
<text class="body" x="210" y="340" font-size="10.5" fill="#6B6A64">every mechanism reads and writes the world; the mechanisms hold no state</text>
<text class="mono" x="58" y="360" font-size="10.5" fill="#332E6E">held · rule states · encounters &amp; payoffs · history (history_len) · aggregates · topology</text>

<text class="body" x="460" y="394" font-size="10.5" fill="#6B6A64" text-anchor="middle">next step until t_max or the metrics stop rule (stop_tol + stop_window)</text>
<text class="body" x="460" y="412" font-size="10.5" fill="#6B6A64" text-anchor="middle">the order of [[mechanism]] entries does not matter; a population dynamic must be listed after game_decide</text>

</svg>
