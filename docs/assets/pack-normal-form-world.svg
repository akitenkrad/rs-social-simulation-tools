<svg width="100%" viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>normal-form pack — GameWorld built from the whole scenario</title>
<desc>The scenario's [world], [world.game], [world.population] and [[mechanism]] sections go to NormalFormPack, which reads world.game.kind with game_family and hands the whole scenario to GameTrialFactory over FiniteSpec or ContinuousSpec with the built-in rules. The factory builds a GameWorld holding the clock, the game, the topology, the held actions, the rule states, this step's encounters and payoffs, the history ring and the aggregates. Ten kinds are finite (four of them anonymous, which allows counting = true) and three are continuous.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6F4EE"/>
    <stop offset="1" stop-color="#ECEAE2"/>
  </linearGradient>
  <marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-weight: 700; }
    .body  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
</defs>

<rect x="3" y="3" width="874" height="434" rx="18" fill="url(#bg)" stroke="#D9D6CC" stroke-width="1.5"/>

<text class="title" x="440" y="34" font-size="16" fill="#0F6E56" text-anchor="middle">GameWorld — built from the whole scenario, no Registry</text>

<!-- scenario (left) -->
<rect x="40" y="64" width="240" height="232" rx="13" fill="#FBFAF6" stroke="#0F6E56" stroke-width="1.3"/>
<text class="mono" x="58" y="88" font-size="13" fill="#0F6E56" font-weight="700">scenario.toml</text>
<line x1="58" y1="98" x2="264" y2="98" stroke="#9FD4C4" stroke-width="1"/>
<text class="mono" x="58" y="120" font-size="11.5" fill="#0B5040">[world]</text>
<text class="body" x="58" y="136" font-size="10.5" fill="#6B6A64">n_agents · history_len · topology</text>
<text class="mono" x="58" y="162" font-size="11.5" fill="#0B5040">[world.game]</text>
<text class="body" x="58" y="178" font-size="10.5" fill="#6B6A64">kind = "…" + the game's own keys</text>
<text class="mono" x="58" y="204" font-size="11.5" fill="#0B5040">[world.population]</text>
<text class="body" x="58" y="220" font-size="10.5" fill="#6B6A64">groups: rule + count or share</text>
<text class="body" x="58" y="234" font-size="10.5" fill="#6B6A64">initial actions</text>
<text class="mono" x="58" y="260" font-size="11.5" fill="#0B5040">[[mechanism]]</text>
<text class="body" x="58" y="276" font-size="10.5" fill="#6B6A64">8 names + their params</text>

<!-- dispatch (center) -->
<rect x="316" y="80" width="244" height="54" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text class="mono" x="438" y="102" font-size="12.5" fill="#332E6E" text-anchor="middle" font-weight="700">NormalFormPack</text>
<text class="mono" x="438" y="122" font-size="10.5" fill="#534AB7" text-anchor="middle">game_family(scenario)</text>

<rect x="346" y="170" width="214" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text class="mono" x="453" y="191" font-size="10" fill="#0B5040" text-anchor="middle">GameTrialFactory&lt;FiniteSpec&gt;</text>
<text class="body" x="453" y="209" font-size="9.5" fill="#3C7E6C" text-anchor="middle">finite_builtins() rules</text>

<rect x="346" y="236" width="214" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text class="mono" x="453" y="257" font-size="10" fill="#0B5040" text-anchor="middle">GameTrialFactory&lt;ContinuousSpec&gt;</text>
<text class="body" x="453" y="275" font-size="9.5" fill="#3C7E6C" text-anchor="middle">continuous_builtins() rules</text>

<g stroke="#0F6E56" stroke-width="1.6" fill="none">
  <path d="M280 120 C 296 120, 300 107, 314 107" marker-end="url(#gn)"/>
  <path d="M330 134 V261"/>
  <path d="M330 195 H344" marker-end="url(#gn)"/>
  <path d="M330 261 H344" marker-end="url(#gn)"/>
</g>
<text class="body" x="338" y="160" font-size="9.5" fill="#0F6E56">kind → family</text>

<!-- world (right) -->
<rect x="600" y="64" width="240" height="232" rx="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text class="mono" x="618" y="88" font-size="13" fill="#0F6E56" font-weight="700">GameWorld&lt;G, X = ()&gt;</text>
<text class="body" x="618" y="106" font-size="10.5" fill="#3C7E6C">(socsim-games)</text>
<line x1="618" y1="116" x2="824" y2="116" stroke="#9FD4C4" stroke-width="1"/>
<g class="mono" font-size="11" fill="#0B5040">
  <text x="618" y="136">clock · game: G · topology</text>
  <text x="618" y="154">held: Vec&lt;G::Action&gt;</text>
  <text x="618" y="172">policies: rule states</text>
  <text x="618" y="190">plays: this step's encounters</text>
  <text x="618" y="208">payoffs · n_played</text>
  <text x="618" y="226">history (history_len)</text>
  <text x="618" y="244">aggregates (optional)</text>
</g>
<text class="body" x="618" y="270" font-size="10.5" fill="#3C7E6C">everything a resumed run needs;</text>
<text class="body" x="618" y="284" font-size="10.5" fill="#3C7E6C">the mechanisms hold no state</text>

<g stroke="#0F6E56" stroke-width="1.6" fill="none">
  <path d="M560 195 H598" marker-end="url(#gn)"/>
  <path d="M560 261 H598" marker-end="url(#gn)"/>
</g>
<text class="body" x="579" y="187" font-size="9.5" fill="#0F6E56" text-anchor="middle">builds</text>
<text class="body" x="579" y="253" font-size="9.5" fill="#0F6E56" text-anchor="middle">builds</text>

<!-- kinds band -->
<rect x="40" y="318" width="800" height="98" rx="12" fill="#FBFAF6" stroke="#0F6E56" stroke-width="1.2"/>
<text class="body" x="58" y="340" font-size="12" fill="#0F6E56" font-weight="700">[world.game] kind → family</text>
<text class="body" x="58" y="364" font-size="11" fill="#0F6E56" font-weight="700">finite</text>
<g class="mono" font-size="10.5" fill="#0B5040">
  <text x="150" y="364">matrix · prisoners_dilemma · battle_of_sexes · matching_pennies · rock_paper_scissors</text>
  <text x="150" y="382">stag_hunt · hawk_dove* · el_farol* · minority* · public_goods_finite*</text>
  <text x="150" y="404">cournot · bertrand_differentiated · public_goods_continuous</text>
</g>
<text class="body" x="630" y="382" font-size="10" fill="#6B6A64">* anonymous: counting = true</text>
<text class="body" x="58" y="404" font-size="11" fill="#0F6E56" font-weight="700">continuous</text>

</svg>
