# Normal-form Game Scenario — generated by `socsim init`
# Three-firm Cournot oligopoly with damped best responses. Run with:
#   socsim run <this-file>

[simulation]
name        = "cournot_n3"
module_pack = "normal-form"
t_max       = 500
seed        = 7
scheduler   = "sequential"

[world]
n_agents    = 3
history_len = 16

[world.game]
kind  = "cournot"                            # The firm count comes from world.n_agents.
a     = 100.0
b     = 1.0
c     = 10.0
q_max = 100.0

[world.population]
initial_uniform = true                       # Draw each initial quantity uniformly from [0, q_max].
[[world.population.group]]
rule  = "damped_best_response"
count = 3

[[mechanism]]
name = "game_match"
[mechanism.params]
matching = "whole_population"

[[mechanism]]
name = "game_decide"
[mechanism.params]
br_damping = 0.5

[[mechanism]]
name = "game_play"
[mechanism.params]
aggregate_history_len = 16                   # Enable game.aggregate.* metrics.
                                             # Positive values differ only in retained history length.

[[mechanism]]
name = "game_metrics"
[mechanism.params]
equilibrium = "solve"                        # Compare with q* = min((a-c)/((n+1)b), q_max) = 22.5.
stop_tol    = 1e-9
stop_window = 10

[output]
log_path = "runs/{name}_{seed}.jsonl"
metrics  = ["game.mean_action.0", "game.eq_distance", "game.aggregate.total_output"]
