# Normal-form Game Scenario — generated by `socsim init`
# Repeated prisoner's dilemma: tit for tat versus fictitious play. Run with:
#   socsim run <this-file>

[simulation]
name        = "ipd_tft_vs_fp"
module_pack = "normal-form"
t_max       = 200
seed        = 42
scheduler   = "sequential"

[world]
n_agents    = 2
history_len = 200

[world.game]
kind    = "matrix"
labels  = [["C", "D"], ["C", "D"]]
payoffs = [
  [[3.0, 3.0], [0.0, 5.0]],
  [[5.0, 0.0], [1.0, 1.0]],
]

[world.population]
assign = "ordered"                            # Assign to AgentId 0, 1, ... in group order.
[[world.population.group]]
rule  = "tit_for_tat"
count = 1
[[world.population.group]]
rule  = "fictitious_play"
count = 1

[[mechanism]]
name = "game_match"
[mechanism.params]
matching = "fixed_players"
pairs    = [[0, 1]]

[[mechanism]]
name = "game_decide"
[mechanism.params]
decision_scope = "per_step"
coop_label     = "C"                          # Cooperative action for automata.
fp_tie_break   = "lowest_index"

[[mechanism]]
name = "game_play"
[mechanism.params]
payoff_aggregation = "sum"

[[mechanism]]
name = "game_metrics"
[mechanism.params]
cooperate_label = "C"
equilibrium     = "solve"                     # Solve the small game for Nash-equilibrium distance.

[output]
log_path = "runs/{name}_{seed}.jsonl"
metrics  = ["game.mean_payoff", "game.played_share.a0", "game.regret"]   # a0 is action 0, labelled C.
