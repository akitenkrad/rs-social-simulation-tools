# Normal-form Game Scenario — generated by `socsim init`
# Spatial prisoner's dilemma on a toroidal grid. Run with:
#   socsim run <this-file>

[simulation]
name        = "nowak_may_b185"
module_pack = "normal-form"
t_max       = 200
seed        = 1
scheduler   = "sequential"

[world]
topology     = "grid"
grid_rows    = 100
grid_cols    = 100
boundary     = "toroidal"
neighborhood = "moore"
history_len  = 1

[world.game]
kind       = "prisoners_dilemma"
temptation = 1.85
reward     = 1.0
punishment = 0.0
sucker     = 0.0

[world.population]
initial_shares = { C = 0.9 }                 # D receives the remaining share, 0.1.
[[world.population.group]]
rule  = "held"                               # Every agent retains its current action.
share = 1.0

[[mechanism]]
name = "game_match"
[mechanism.params]
matching     = "grid_neighborhood"
include_self = true

[[mechanism]]
name = "game_decide"

[[mechanism]]
name = "game_play"
[mechanism.params]
payoff_aggregation = "sum"

[[mechanism]]
name = "imitate_best"
[mechanism.params]
update    = "synchronous"                    # The update mode is required.
tie_break = "keep_own"

[[mechanism]]
name = "game_metrics"
[mechanism.params]
cooperate_label  = "C"
population_share = true                      # Record game.population_share.a<k>.

[output]
log_path = "runs/{name}_{seed}.jsonl"
metrics  = ["game.population_share.a0"]      # a0 is action 0, labelled C.
