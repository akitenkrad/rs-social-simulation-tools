[project]
name = "socsim-tools"
version = "0.1.0"
description = "Shared CLI dispatcher + experiment-settings renderer + results I/O helpers for socsim replication tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
io = ["pandas>=2.2"]
games = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.11"]
dev = ["pytest>=8", "pandas>=2.2", "matplotlib==3.11.2", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
socsim-tools = "socsim_tools.cli:_demo_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socsim_tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
